[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fritzconnection-enhanced"
version = "1.0.0"
description = "Custom FritzConnection library for HA voicemail"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["fritzconnection_enhanced*"]
exclude = [
    "fritzconnection_enhanced.tests*",
]